global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: control-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:8002"]
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
