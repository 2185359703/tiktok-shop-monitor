[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-shop-monitor"
version = "0.1.0"
description = "TikTok Shop clothing price and competitor monitoring"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.41,<2.1",
    "PyMySQL[rsa]>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.28,<0.29",
    "curl_cffi==0.15.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pika>=1.3,<2",
    "redis>=5.2,<6",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app" = ["frontend/*.html", "frontend/*.css", "frontend/*.js", "frontend/fonts/*"]
"app.reports" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
