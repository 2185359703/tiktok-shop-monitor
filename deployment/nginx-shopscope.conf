# Versioned ShopScope static UI; analytics requests retain the running API cache.
location = /shopscope/ {
    root /opt/tiktok-shop-monitor/releases/frontend-ui-shop-picker-20261015-2250/app/frontend;
    try_files /index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store";
}

location ^~ /shopscope/ui-assets/ {
    alias /opt/tiktok-shop-monitor/releases/frontend-ui-shop-picker-20261015-2250/app/frontend/;
    autoindex off;
    add_header Cache-Control "no-store";
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css image/svg+xml;
}

# Managed for tiktok-shop-monitor public entry.
# Included inside the existing HTTP server block.

location = /shopscope {
    return 308 /shopscope/;
}

location = /shopscope/openapi.json {
    alias /opt/tiktok-shop-monitor/deployment/public-openapi.json;
    default_type application/json;
    add_header Cache-Control "no-store";
}

location = /shopscope/docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '/openapi.json' '/shopscope/openapi.json';
    sub_filter '/docs/oauth2-redirect' '/shopscope/docs/oauth2-redirect';
}

location = /shopscope/redoc {
    proxy_pass http://127.0.0.1:8000/redoc;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter '/openapi.json' '/shopscope/openapi.json';
}

location ^~ /shopscope/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 60s;
    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css;
}
