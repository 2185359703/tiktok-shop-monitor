# Versioned application rollout; existing infrastructure volumes stay in place.
services:
  mysql:
    mem_limit: 1g
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00", "--innodb-buffer-pool-size=536870912", "--max-connections=70", "--performance-schema=OFF", "--skip-log-bin"]
  api:
    image: tiktok-shop-monitor:frontend-20261015-images-verified-c7a93e14
    volumes:
      - ../releases/frontend-ui-scatter-20261015-2147/app/frontend:/opt/tiktok-shop-monitor/app/frontend:ro
      - ../releases/frontend-status-20261015-f284a6c1/app/services/image_backfill.py:/opt/tiktok-shop-monitor/app/services/image_backfill.py:ro
  worker:
    image: tiktok-shop-monitor:frontend-20261015-images-verified-c7a93e14
    stop_grace_period: 300s
  scheduler:
    image: tiktok-shop-monitor:frontend-20261015-images-verified-c7a93e14
  collection:
    image: tiktok-shop-monitor:frontend-20261015-images-verified-c7a93e14
